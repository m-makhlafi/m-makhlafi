<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-label="GitHub stats">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .t { font-size: 16px; font-weight: 600; fill: #0891b2; }
    .l { font-size: 13px; fill: #5b6577; }
    .v { font-size: 13px; font-weight: 700; fill: #0b1220; font-variant-numeric: tabular-nums; }
    .big { font-size: 26px; font-weight: 800; fill: #0b1220; }
    .s { font-size: 12px; fill: #5b6577; }
  </style>
  <rect x=".5" y=".5" width="399" height="189" rx="8" fill="#f4f6fa" stroke="#dde3ec"/>
  <text x="22" y="34" class="t">GitHub stats</text>
  <g class="row" style="animation-delay:150ms">
    <text x="22" y="66" class="l">Total stars earned</text>
    <text x="378" y="66" class="v" text-anchor="end">0</text>
  </g>
  <g class="row" style="animation-delay:270ms">
    <text x="22" y="91" class="l">Commits (2026)</text>
    <text x="378" y="91" class="v" text-anchor="end">51</text>
  </g>
  <g class="row" style="animation-delay:390ms">
    <text x="22" y="116" class="l">Pull requests</text>
    <text x="378" y="116" class="v" text-anchor="end">4</text>
  </g>
  <g class="row" style="animation-delay:510ms">
    <text x="22" y="141" class="l">Issues</text>
    <text x="378" y="141" class="v" text-anchor="end">0</text>
  </g>
  <g class="row" style="animation-delay:630ms">
    <text x="22" y="166" class="l">Contributed to (last year)</text>
    <text x="378" y="166" class="v" text-anchor="end">1</text>
  </g>
</svg>

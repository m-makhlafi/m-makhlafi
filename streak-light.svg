<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-label="Contribution streak">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .t { font-size: 16px; font-weight: 600; fill: #0891b2; }
    .l { font-size: 13px; fill: #5b6577; }
    .v { font-size: 13px; font-weight: 700; fill: #0b1220; font-variant-numeric: tabular-nums; }
    .big { font-size: 26px; font-weight: 800; fill: #0b1220; }
    .s { font-size: 12px; fill: #5b6577; }
  </style>
  <rect x=".5" y=".5" width="399" height="189" rx="8" fill="#f4f6fa" stroke="#dde3ec"/>
  <text x="22" y="34" class="t">Contribution streak</text>
  <g class="row" style="animation-delay:150ms"><text x="85" y="104" class="big" text-anchor="middle">95</text><text x="85" y="128" class="s" text-anchor="middle">Total contributions</text><text x="85" y="148" class="s" text-anchor="middle">since 2025-08-15</text></g>
  <g class="row" style="animation-delay:300ms"><circle cx="200" cy="96" r="38" fill="none" stroke="#e8483a" stroke-width="4"/><text x="200" y="105" class="big" text-anchor="middle" style="fill:#e8483a">1</text><text x="200" y="158" class="s" text-anchor="middle">Current streak (days)</text></g>
  <g class="row" style="animation-delay:450ms"><text x="315" y="104" class="big" text-anchor="middle">3</text><text x="315" y="128" class="s" text-anchor="middle">Longest streak (days)</text></g>
</svg>
